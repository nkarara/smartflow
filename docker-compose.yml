services:
  db:
    image: postgres:16-alpine
    container_name: smartflow-db
    environment:
      POSTGRES_DB: smartflow
      POSTGRES_USER: smartflow
      POSTGRES_PASSWORD: smartflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartflow -d smartflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: smartflow-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/smartflow
      DB_USERNAME: smartflow
      DB_PASSWORD: smartflow
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-via-env-in-production-2026-32chars}
      JWT_ACCESS_TOKEN_VALIDITY_MINUTES: ${JWT_ACCESS_TOKEN_VALIDITY_MINUTES:-15}
      JWT_REFRESH_TOKEN_VALIDITY_DAYS: ${JWT_REFRESH_TOKEN_VALIDITY_DAYS:-7}
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://localhost:5173
      AI_API_KEY: ${AI_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-local}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      SEED_ENABLED: ${SEED_ENABLED:-true}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: smartflow-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
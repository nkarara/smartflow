spring:
  application:
    name: smartflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartflow}
    username: ${DB_USERNAME:smartflow}
    password: ${DB_PASSWORD:smartflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

smartflow:
  jwt:
    secret: ${JWT_SECRET:smartflow-demo-secret-key-change-me-in-production-min-32-bytes}
    access-token-validity-minutes: ${JWT_ACCESS_TOKEN_VALIDITY_MINUTES:15}
    refresh-token-validity-days: ${JWT_REFRESH_TOKEN_VALIDITY_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  upload-dir: ${UPLOAD_DIR:./uploads}
  seed:
    enabled: ${SEED_ENABLED:true}
  ai:
    provider: ${AI_PROVIDER:local}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.hibernate.SQL: warn
# Profil "local" : base H2 en mémoire (démonstration sans PostgreSQL).
# Activer via :  mvnw -Plocal spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:h2:mem:smartflow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

server:
  port: 8080

smartflow:
  seed:
    enabled: true